<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read-only scores, standings, rosters, and history for the Oakland Perennial Football League.">
  <meta name="theme-color" content="#071321">
  <title>OPFL Archive &amp; Scoreboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="#/2025/home" aria-label="OPFL home">
      <span class="brand-mark" aria-hidden="true">O</span>
      <span><strong>OPFL</strong><small>Since 1988</small></span>
    </a>
    <div class="header-actions">
      <label class="season-picker">Season
        <select id="season-select" aria-label="Select season"></select>
      </label>
      <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
        <span aria-hidden="true">☰</span><span>Menu</span>
      </button>
    </div>
  </header>
  <div class="app-shell">
    <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
      <a data-view="home" href="#/2025/home">Home</a>
      <a data-view="matchups" data-capability="matchups" href="#/2025/matchups">Matchups</a>
      <a data-view="schedule" data-capability="schedules" href="#/2025/schedule">Schedule</a>
      <a data-view="standings" href="#/2025/standings">Standings</a>
      <a data-view="rosters" data-capability="rosters" href="#/2025/rosters">Rosters</a>
      <a data-view="stats" data-capability="player_stats" href="#/2025/stats">Stats</a>
      <a data-view="transactions" href="#/2025/transactions">Transactions</a>
      <a data-view="drafts" href="#/2025/drafts">Drafts</a>
      <a data-view="history" href="#/2025/history">History</a>
      <a data-view="rules" href="#/2025/rules">Rules</a>
      <a data-view="banners" href="#/2025/banners">Banner Room</a>
    </nav>
    <main id="main-content" tabindex="-1">
      <div id="status" class="status" role="status" aria-live="polite">Loading OPFL archive…</div>
      <div id="app"></div>
    </main>
  </div>
  <noscript><p class="noscript">This read-only archive requires JavaScript to load its season data.</p></noscript>
</body>
</html>
