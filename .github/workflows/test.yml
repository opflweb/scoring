name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Lint with ruff
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Run tests
        run: |
          # Baseline measured at 58% on the opfl package (2026-09); ratchet this
          # up as coverage grows rather than starting at an arbitrary target.
          # data_fetcher.py and scorer.py are the bulk of the gap - both make
          # live nflreadpy calls that would need network mocking to unit test.
          uv run --frozen pytest -q --cov=opfl --cov-branch --cov-report=term --cov-fail-under=55

      - name: Syntax-check web/app.js
        run: node --check web/app.js

      - name: Check for TODO/FIXME comments
        run: |
          echo "Checking for high-priority TODOs..."
          grep -rn "TODO.*URGENT\|FIXME" opfl/ scripts/ || echo "No urgent TODOs found"
        continue-on-error: true
