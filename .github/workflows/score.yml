name: OPFL Autoscorer

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL Week number'
        required: false
        type: number

  # Scheduled runs - 30 minutes after nflverse data updates
  # Only runs during NFL season months (Jan, Feb, Sep-Dec)
  schedule:
    # Daily at 9:30 UTC / 5:30 AM ET (data updates at 9:00 UTC)
    - cron: '30 9 * 1,2,9-12 *'
    # TNF: 6:00 AM UTC / 1:00 AM ET Friday (data updates at 5:30 UTC)
    - cron: '0 6 * 1,2,9-12 5'
    # Sunday early window: 10:30 PM UTC / 5:30 PM ET (data updates at 22:00 UTC)
    - cron: '30 22 * 1,2,9-12 0'
    # Sunday late window: 0:35 UTC / 7:35 PM ET Monday (data updates at 0:05 UTC)
    - cron: '35 0 * 1,2,9-12 1'
    # SNF: 6:00 AM UTC / 1:00 AM ET Monday (data updates at 5:30 UTC)
    - cron: '0 6 * 1,2,9-12 1'
    # MNF: 6:00 AM UTC / 1:00 AM ET Tuesday (data updates at 5:30 UTC)
    - cron: '0 6 * 1,2,9-12 2'

env:
  SEASON: '2026'
  WORKBOOK: 'OPFL Scoring 2026.xlsx'

# Runs commit and push, so queue overlapping triggers (a cron tick landing
# mid-run) rather than cancelling one - a cancelled run can leave a partial
# commit.
concurrency:
  group: opfl-scoring
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Trigger Time Check
        id: check_window
        run: |
          # Always run for scheduled triggers (crons are set to specific times)
          # Always run for manual dispatch
          echo "in_window=true" >> $GITHUB_OUTPUT
          export TZ='America/New_York'
          echo "Trigger: ${{ github.event_name }}, Current ET: $(date)"

      - name: Checkout repository
        if: steps.check_window.outputs.in_window == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check_window.outputs.in_window == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        if: steps.check_window.outputs.in_window == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        if: steps.check_window.outputs.in_window == 'true'
        run: uv sync --frozen --extra dev

      - name: Check web/app.js syntax
        if: steps.check_window.outputs.in_window == 'true'
        run: node --check web/app.js

      - name: Determine current NFL week
        if: steps.check_window.outputs.in_window == 'true'
        id: week
        run: |
          WEEK="${{ github.event.inputs.week }}"
          if [ -z "$WEEK" ]; then
            WEEK=$(uv run --frozen python scripts/nfl_week.py --season ${{ env.SEASON }})
          fi
          echo "week=$WEEK" >> $GITHUB_OUTPUT
          echo "Scoring NFL Week: $WEEK"

      - name: Run autoscorer (workbook-based for 2026+)
        if: steps.check_window.outputs.in_window == 'true'
        run: |
          WEEK=${{ steps.week.outputs.week }}
          uv run --frozen python autoscorer.py --excel "${{ env.WORKBOOK }}" --week $WEEK --season ${{ env.SEASON }}

      - name: Export scores for web
        if: steps.check_window.outputs.in_window == 'true'
        run: |
          WEEK=${{ steps.week.outputs.week }}
          uv run --frozen python scripts/export_for_web.py --excel "${{ env.WORKBOOK }}" --week $WEEK --season ${{ env.SEASON }}

      - name: Validate exported data
        if: steps.check_window.outputs.in_window == 'true'
        run: uv run --frozen pytest tests/test_export_shape.py tests/test_no_workbook_writes.py tests/test_autoscorer_output.py tests/test_ui_player_scores.py tests/test_game_times.py tests/test_projections.py -q

      - name: Commit and push updated scores
        if: steps.check_window.outputs.in_window == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add web/data.json web/images/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update scores for Week ${{ steps.week.outputs.week }} - $(date -u '+%Y-%m-%d %H:%M UTC')"
            bash scripts/git_push_with_retry.sh origin main 5
          fi

      - name: Setup Pages
        if: steps.check_window.outputs.in_window == 'true'
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: steps.check_window.outputs.in_window == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        if: steps.check_window.outputs.in_window == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
