name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --all-extras

      - name: Ruff
        run: |
          .venv/bin/ruff check opfl scripts tests
          .venv/bin/ruff format --check opfl scripts tests

      - name: Mypy
        run: .venv/bin/mypy opfl scripts

      - name: Tests and coverage
        run: .venv/bin/pytest --cov --cov-report=term-missing

      - name: JSON schemas and cross-file integrity
        run: .venv/bin/python scripts/validate_data.py

      - name: JavaScript syntax
        run: node --check web/app.js
