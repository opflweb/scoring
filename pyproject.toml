[project]
name = "opfl-autoscorer"
version = "1.0.0"
description = "Automated fantasy football scoring for OPFL using nflreadpy"
requires-python = ">=3.10"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0.0",
    "openpyxl>=3.1.0",
    "thefuzz>=0.22.0",
]

[project.scripts]
opfl-score = "autoscorer:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["opfl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (formatter handles this)
    "B008",   # function call in argument defaults
    "C901",   # too complex (handled gradually)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]  # unused imports / redefinition are fine in tests

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
