[project]
name = "opfl-autoscorer"
version = "2.0.0"
description = "JSON-first scoring and read-only archives for the OPFL"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23.0",
    "nflreadpy>=0.1.5",
    "polars>=1.0.0",
    "openpyxl>=3.1.0",
    "thefuzz>=0.22.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
opfl-score = "autoscorer:main"
opfl-import-season = "scripts.import_season:main"
opfl-import-lineups = "scripts.import_lineups:main"
opfl-score-json = "scripts.score_json_week:main"
opfl-export = "scripts.export_public:main"
opfl-validate = "scripts.validate_data:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
pythonpath = ["."]

[tool.coverage.run]
source = ["opfl"]
omit = ["opfl/data_fetcher.py", "opfl/excel_parser.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["api/", "scripts/export_for_web.py", "scripts/migrate_to_json.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["api", "scripts/export_for_web.py", "scripts/migrate_to_json.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["opfl*"]
